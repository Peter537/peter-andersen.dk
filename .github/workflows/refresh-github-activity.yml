name: Refresh GitHub activity

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: github-activity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Peter537/peter-andersen.dk
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Build validated activity snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_ACTIVITY_USERNAME: Peter537
        run: node scripts/update-github-activity.mjs

      - name: Commit and push a changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add -- github-activity.json
          if git diff --cached --quiet; then
            echo "GitHub activity is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh GitHub activity"
          git pull --rebase origin main
          git push origin HEAD:main
